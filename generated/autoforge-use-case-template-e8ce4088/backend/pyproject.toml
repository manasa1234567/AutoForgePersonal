[tool.poetry]
name = "autoforge-use-case-template-backend"
version = "0.1.0"
description = "Backend for AutoForge Use Case Template"
authors = ["AutoForge"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.12"
uvicorn[standard] = "0.34.2"
pydantic = "2.11.3"
psycopg[binary] = "^2.9.6"
asyncpg = "^0.27.0"
SQLAlchemy = "2.0.22"
alembic = "1.11.1"
python-dotenv = "^1.0.0"
passlib[bcrypt] = "^1.7.4"
python-jose = "^3.3.0"
python-multipart = "^0.0.6"

[tool.poetry.dev-dependencies]
pytest = "^7.3.7"
httpx = "^0.24.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "uvicorn app.main:app --host=0.0.0.0 --port=8080"

[tool.poetry.package-mode]
package = false
