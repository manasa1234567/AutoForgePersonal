[tool.poetry]
name = "autoforge-backend"
version = "0.1.0"
description = "Backend FastAPI for Autoforge Learning Dashboard"
authors = ["AutoForge <auto@forge.example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.12"
uvicorn = {extras = ["standard"], version = "0.34.2"}
pydantic = "2.11.3"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
httpx = "^0.24"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
