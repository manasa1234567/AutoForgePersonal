name: CD - Azure

on:
  workflow_dispatch:            # Phase 1: manual
  # Phase 2: delete the line above and uncomment this block
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

permissions:
  id-token: write               # required for OIDC login
  contents: read

env:
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io

jobs:
  deploy:
    # Phase 2: uncomment this line
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production     # must match the federated credential subject
    steps:
      - uses: actions/checkout@v4
        # Phase 2: uncomment so the exact CI-tested commit is deployed
        # with:
        #   ref: ${{ github.event.workflow_run.head_sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push images
        run: |
          docker build -t $REGISTRY/aegis-backend:${{ github.sha }} ./backend
          docker build -f frontend/Dockerfile -t $REGISTRY/aegis-frontend:${{ github.sha }} .
          docker push $REGISTRY/aegis-backend:${{ github.sha }}
          docker push $REGISTRY/aegis-frontend:${{ github.sha }}

      - name: Deploy backend
        run: |
          az containerapp ingress update -g ${{ vars.AZURE_RG }} -n aegis-backend --target-port 8000
          az containerapp update -g ${{ vars.AZURE_RG }} -n aegis-backend \
            --image $REGISTRY/aegis-backend:${{ github.sha }}

      - name: Deploy frontend
        run: |
          az containerapp update -g ${{ vars.AZURE_RG }} -n aegis-frontend \
            --image $REGISTRY/aegis-frontend:${{ github.sha }}

      - name: Smoke test
        run: |
          URL=$(az containerapp show -g ${{ vars.AZURE_RG }} -n aegis-frontend \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "App URL: https://$URL"
          for i in 1 2 3 4 5 6; do
            curl -fsS https://$URL/api/health && exit 0
            sleep 10
          done
          exit 1