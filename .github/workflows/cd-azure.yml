name: CD - Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: cd-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_SPEC_MODEL: ${{ vars.FOUNDRY_SPEC_MODEL }}
      FOUNDRY_ARCHITECTURE_MODEL: ${{ vars.FOUNDRY_ARCHITECTURE_MODEL }}
      FOUNDRY_CODER_MODEL: ${{ vars.FOUNDRY_CODER_MODEL }}
      FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
      AZURE_CONTENT_SAFETY_ENDPOINT: ${{ vars.AZURE_CONTENT_SAFETY_ENDPOINT }}
      AZURE_PROMPT_SHIELDS_API_VERSION: ${{ vars.AZURE_PROMPT_SHIELDS_API_VERSION || '2024-09-01' }}
      FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID }}
      FOUNDRY_RUNTIME_CLIENT_ID: ${{ vars.FOUNDRY_RUNTIME_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Backend Image
        run: |
          docker build \
            -t $REGISTRY/aegis-backend:$IMAGE_TAG \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t $REGISTRY/aegis-frontend:$IMAGE_TAG \
            .

      - name: Push Images
        run: |
          docker push $REGISTRY/aegis-backend:$IMAGE_TAG
          docker push $REGISTRY/aegis-frontend:$IMAGE_TAG

      - name: Configure Backend Identity
        if: env.FOUNDRY_PROJECT_ENDPOINT != ''
        run: |
          az containerapp identity assign \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --user-assigned "$FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID"

      - name: Configure Backend Environment Variables
        if: env.FOUNDRY_PROJECT_ENDPOINT != ''
        run: |
          az containerapp update \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --set-env-vars \
            FOUNDRY_PROJECT_ENDPOINT="$FOUNDRY_PROJECT_ENDPOINT" \
            FOUNDRY_SPEC_MODEL="$FOUNDRY_SPEC_MODEL" \
            FOUNDRY_ARCHITECTURE_MODEL="$FOUNDRY_ARCHITECTURE_MODEL" \
            FOUNDRY_CODER_MODEL="$FOUNDRY_CODER_MODEL" \
            FOUNDRY_MODEL="$FOUNDRY_MODEL" \
            AZURE_CONTENT_SAFETY_ENDPOINT="$AZURE_CONTENT_SAFETY_ENDPOINT" \
            AZURE_PROMPT_SHIELDS_API_VERSION="$AZURE_PROMPT_SHIELDS_API_VERSION" \
            AUTOFORGE_IDENTITY_MODE=managed_identity \
            AZURE_CLIENT_ID="$FOUNDRY_RUNTIME_CLIENT_ID"

      - name: Deploy Backend
        run: |
          az containerapp ingress update \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --target-port 8000 \
            --transport http

          az containerapp update \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --image $REGISTRY/aegis-backend:$IMAGE_TAG

      - name: Get Backend URL
        id: backend
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "backend_fqdn=$BACKEND_FQDN" >> $GITHUB_OUTPUT

      - name: Deploy Frontend
        run: |
          az containerapp ingress update \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-frontend \
            --target-port 80 \
            --transport http

          az containerapp update \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-frontend \
            --image $REGISTRY/aegis-frontend:$IMAGE_TAG \
            --set-env-vars BACKEND_URL=https://${{ steps.backend.outputs.backend_fqdn }}

      - name: Smoke Test
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-frontend \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          BACKEND_FQDN=$(az containerapp show \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "Frontend URL: https://$FRONTEND_FQDN"
          echo "Backend URL : https://$BACKEND_FQDN"

          for i in {1..12}
          do
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://$FRONTEND_FQDN/)

            BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://$BACKEND_FQDN/api/health)

            echo "Attempt $i"
            echo "Frontend: $FRONTEND_STATUS"
            echo "Backend : $BACKEND_STATUS"

            if [[ "$FRONTEND_STATUS" == "200" && "$BACKEND_STATUS" == "200" ]]; then
              echo "Deployment successful"
              exit 0
            fi

            sleep 15
          done

          echo "Smoke test failed"
          exit 1

      - name: Backend Diagnostics
        if: failure()
        run: |
          echo "=== Backend Revisions ==="
          az containerapp revision list \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            -o table

          echo "=== Backend Status ==="
          az containerapp show \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-backend \
            --query properties.runningStatus

      - name: Frontend Diagnostics
        if: failure()
        run: |
          echo "=== Frontend Revisions ==="
          az containerapp revision list \
            --resource-group ${{ vars.AZURE_RG }} \
            --name aegis-frontend \
            -o table