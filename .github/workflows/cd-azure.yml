name: CD - Azure

on:
  push:
    branches: [main]              # force: deploy on every push to main
  workflow_dispatch:              # manual button
  # Safe mode (recommended later): delete the push block above and use this instead
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

permissions:
  id-token: write                 # required for OIDC login
  contents: read

env:
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: cd-azure
  cancel-in-progress: false       # queue deploys, never cut one off midway

jobs:
  deploy:
    # Never skipped for push or manual runs; workflow_run needs a green CI
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production       # must match the federated credential subject
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_SPEC_MODEL: ${{ vars.FOUNDRY_SPEC_MODEL }}
      FOUNDRY_ARCHITECTURE_MODEL: ${{ vars.FOUNDRY_ARCHITECTURE_MODEL }}
      FOUNDRY_CODER_MODEL: ${{ vars.FOUNDRY_CODER_MODEL }}
      FOUNDRY_CRITIC_MODEL: ${{ vars.FOUNDRY_CRITIC_MODEL }}
      FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
      AZURE_CONTENT_SAFETY_ENDPOINT: ${{ vars.AZURE_CONTENT_SAFETY_ENDPOINT }}
      AZURE_PROMPT_SHIELDS_API_VERSION: ${{ vars.AZURE_PROMPT_SHIELDS_API_VERSION || '2024-09-01' }}
      FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID: ${{ vars.FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID }}
      FOUNDRY_RUNTIME_CLIENT_ID: ${{ vars.FOUNDRY_RUNTIME_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RG }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
      ACA_ENVIRONMENT_NAME: ${{ vars.ACA_ENVIRONMENT_NAME || 'aegis-env' }}
      ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP || 'aegis-rg' }}
      AUTOFORGE_GITHUB_OWNER: ${{ vars.AUTOFORGE_GITHUB_OWNER || 'manasa1234567' }}
      AUTOFORGE_GITHUB_REPOSITORY: ${{ vars.AUTOFORGE_GITHUB_REPOSITORY || 'AutoForgePersonal' }}
      AUTOFORGE_SANDBOX_ENABLED: ${{ vars.AUTOFORGE_SANDBOX_ENABLED || 'false' }}
      AUTOFORGE_SANDBOX_ENDPOINT: ${{ vars.AUTOFORGE_SANDBOX_ENDPOINT }}
      AUTOFORGE_SANDBOX_ROUTE: ${{ vars.AUTOFORGE_SANDBOX_ROUTE || '/autoforge/validate' }}
      AUTOFORGE_SANDBOX_TIMEOUT_SECONDS: ${{ vars.AUTOFORGE_SANDBOX_TIMEOUT_SECONDS || '120' }}
      AUTOFORGE_PERSISTENCE: ${{ vars.AUTOFORGE_PERSISTENCE || 'local' }}
      AUTOFORGE_COSMOS_ENDPOINT: ${{ vars.AUTOFORGE_COSMOS_ENDPOINT }}
      AUTOFORGE_COSMOS_DATABASE: ${{ vars.AUTOFORGE_COSMOS_DATABASE || 'autoforge' }}
      AUTOFORGE_COSMOS_JOBS_CONTAINER: ${{ vars.AUTOFORGE_COSMOS_JOBS_CONTAINER || 'jobs' }}
      AUTOFORGE_COSMOS_SKILLS_CONTAINER: ${{ vars.AUTOFORGE_COSMOS_SKILLS_CONTAINER || 'skills' }}
      AUTOFORGE_BLOB_ACCOUNT_URL: ${{ vars.AUTOFORGE_BLOB_ACCOUNT_URL }}
      AUTOFORGE_BLOB_SPECS_CONTAINER: ${{ vars.AUTOFORGE_BLOB_SPECS_CONTAINER || 'specs' }}
      AUTOFORGE_BLOB_WORKSPACES_CONTAINER: ${{ vars.AUTOFORGE_BLOB_WORKSPACES_CONTAINER || 'workspaces' }}
      AUTOFORGE_GITHUB_PUBLISH_ENABLED: ${{ vars.AUTOFORGE_GITHUB_PUBLISH_ENABLED || 'false' }}
      AUTOFORGE_GITHUB_BASE_BRANCH: ${{ vars.AUTOFORGE_GITHUB_BASE_BRANCH || '' }}
      AUTOFORGE_GITHUB_APP_ID: ${{ vars.AUTOFORGE_GITHUB_APP_ID }}
      AUTOFORGE_GITHUB_INSTALLATION_ID: ${{ vars.AUTOFORGE_GITHUB_INSTALLATION_ID }}
      AUTOFORGE_GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.AUTOFORGE_GITHUB_APP_PRIVATE_KEY_BASE64 }}
      AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN: ${{ secrets.AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate Agent 1 cloud configuration
        run: |
          if [[ -z "$AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN" ]]; then
            echo "Add AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN as a GitHub Actions secret before enabling generated-app deployment."
            exit 1
          fi
          if [[ "$AUTOFORGE_SANDBOX_ENABLED" == "true" && -z "$AUTOFORGE_SANDBOX_ENDPOINT" ]]; then
            echo "Set AUTOFORGE_SANDBOX_ENDPOINT when AUTOFORGE_SANDBOX_ENABLED=true."
            exit 1
          fi
          if [[ "$AUTOFORGE_PERSISTENCE" == "azure" ]]; then
            if [[ -z "$AUTOFORGE_COSMOS_ENDPOINT" || -z "$AUTOFORGE_BLOB_ACCOUNT_URL" ]]; then
              echo "Set AUTOFORGE_COSMOS_ENDPOINT and AUTOFORGE_BLOB_ACCOUNT_URL to enable durable Azure persistence."
              exit 1
            fi
            if [[ -z "$FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID" || -z "$FOUNDRY_RUNTIME_CLIENT_ID" ]]; then
              echo "Set the backend managed identity resource and client IDs before enabling Azure persistence."
              exit 1
            fi
          fi
          if [[ -z "$FOUNDRY_PROJECT_ENDPOINT" && -z "$FOUNDRY_SPEC_MODEL" && -z "$FOUNDRY_ARCHITECTURE_MODEL" && -z "$FOUNDRY_CODER_MODEL" && -z "$FOUNDRY_CRITIC_MODEL" && -z "$FOUNDRY_MODEL" && -z "$AZURE_CONTENT_SAFETY_ENDPOINT" && -z "$FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID" && -z "$FOUNDRY_RUNTIME_CLIENT_ID" && "$AUTOFORGE_SANDBOX_ENABLED" != "true" ]]; then
            echo "Agent 1 Foundry settings are not configured; this deployment will use demo mode."
            exit 0
          fi
          if [[ -z "$FOUNDRY_PROJECT_ENDPOINT" ]]; then
            echo "Set FOUNDRY_PROJECT_ENDPOINT to enable the Foundry Spec Agent."
            exit 1
          fi
          if [[ -z "$FOUNDRY_SPEC_MODEL" && -z "$FOUNDRY_MODEL" ]]; then
            echo "Set FOUNDRY_SPEC_MODEL or FOUNDRY_MODEL in GitHub Actions variables."
            exit 1
          fi
          if [[ -z "$AZURE_CONTENT_SAFETY_ENDPOINT" ]]; then
            echo "Set AZURE_CONTENT_SAFETY_ENDPOINT before enabling the Foundry Spec Agent."
            exit 1
          fi
          if [[ -z "$FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID" || -z "$FOUNDRY_RUNTIME_CLIENT_ID" ]]; then
            echo "Set FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID and FOUNDRY_RUNTIME_CLIENT_ID for the ACA workload identity."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push images
        run: |
          docker build -t $REGISTRY/aegis-backend:$IMAGE_TAG ./backend
          docker build -f frontend/Dockerfile -t $REGISTRY/aegis-frontend:$IMAGE_TAG .
          docker push $REGISTRY/aegis-backend:$IMAGE_TAG
          docker push $REGISTRY/aegis-frontend:$IMAGE_TAG

      - name: Deploy backend
        run: |
          az containerapp ingress update -g ${{ vars.AZURE_RG }} -n aegis-backend \
            --target-port 8000 --transport http
          if [[ -n "$FOUNDRY_PROJECT_ENDPOINT" ]]; then
            az containerapp identity assign -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --user-assigned "$FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID"
            az containerapp update -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --set-env-vars \
                "FOUNDRY_PROJECT_ENDPOINT=$FOUNDRY_PROJECT_ENDPOINT" \
                "FOUNDRY_SPEC_MODEL=$FOUNDRY_SPEC_MODEL" \
                "FOUNDRY_ARCHITECTURE_MODEL=$FOUNDRY_ARCHITECTURE_MODEL" \
                "FOUNDRY_CODER_MODEL=$FOUNDRY_CODER_MODEL" \
                "FOUNDRY_CRITIC_MODEL=$FOUNDRY_CRITIC_MODEL" \
                "FOUNDRY_MODEL=$FOUNDRY_MODEL" \
                "AZURE_CONTENT_SAFETY_ENDPOINT=$AZURE_CONTENT_SAFETY_ENDPOINT" \
                "AZURE_PROMPT_SHIELDS_API_VERSION=$AZURE_PROMPT_SHIELDS_API_VERSION" \
                "AUTOFORGE_SANDBOX_ENABLED=$AUTOFORGE_SANDBOX_ENABLED" \
                "AUTOFORGE_SANDBOX_ENDPOINT=$AUTOFORGE_SANDBOX_ENDPOINT" \
                "AUTOFORGE_SANDBOX_ROUTE=$AUTOFORGE_SANDBOX_ROUTE" \
                "AUTOFORGE_SANDBOX_TIMEOUT_SECONDS=$AUTOFORGE_SANDBOX_TIMEOUT_SECONDS" \
                AUTOFORGE_IDENTITY_MODE=managed_identity \
                "AZURE_CLIENT_ID=$FOUNDRY_RUNTIME_CLIENT_ID"
          else
            echo "Foundry not configured; backend will retain its current settings (new installs use demo mode)."
          fi
          if [[ "$AUTOFORGE_PERSISTENCE" == "azure" ]]; then
            az containerapp identity assign -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --user-assigned "$FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID"
            az containerapp update -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --set-env-vars AUTOFORGE_IDENTITY_MODE=managed_identity "AZURE_CLIENT_ID=$FOUNDRY_RUNTIME_CLIENT_ID"
          fi
          az containerapp update -g "${{ vars.AZURE_RG }}" -n aegis-backend \
            --set-env-vars \
              "AUTOFORGE_PERSISTENCE=$AUTOFORGE_PERSISTENCE" \
              "AUTOFORGE_COSMOS_ENDPOINT=$AUTOFORGE_COSMOS_ENDPOINT" \
              "AUTOFORGE_COSMOS_DATABASE=$AUTOFORGE_COSMOS_DATABASE" \
              "AUTOFORGE_COSMOS_JOBS_CONTAINER=$AUTOFORGE_COSMOS_JOBS_CONTAINER" \
              "AUTOFORGE_COSMOS_SKILLS_CONTAINER=$AUTOFORGE_COSMOS_SKILLS_CONTAINER" \
              "AUTOFORGE_BLOB_ACCOUNT_URL=$AUTOFORGE_BLOB_ACCOUNT_URL" \
              "AUTOFORGE_BLOB_SPECS_CONTAINER=$AUTOFORGE_BLOB_SPECS_CONTAINER" \
              "AUTOFORGE_BLOB_WORKSPACES_CONTAINER=$AUTOFORGE_BLOB_WORKSPACES_CONTAINER" \
              "AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" \
              "AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP" \
              "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" \
              "ACA_ENVIRONMENT_NAME=$ACA_ENVIRONMENT_NAME" \
              "ACA_RESOURCE_GROUP=$ACA_RESOURCE_GROUP" \
              "AUTOFORGE_GITHUB_OWNER=$AUTOFORGE_GITHUB_OWNER" \
              "AUTOFORGE_GITHUB_REPOSITORY=$AUTOFORGE_GITHUB_REPOSITORY" \
              "AUTOFORGE_GITHUB_PUBLISH_ENABLED=$AUTOFORGE_GITHUB_PUBLISH_ENABLED" \
              "AUTOFORGE_GITHUB_BASE_BRANCH=$AUTOFORGE_GITHUB_BASE_BRANCH" \
              AUTOFORGE_DEPLOYMENT_ENABLED=false
          if [[ "$AUTOFORGE_GITHUB_PUBLISH_ENABLED" == "true" && -n "$AUTOFORGE_GITHUB_APP_ID" && -n "$AUTOFORGE_GITHUB_INSTALLATION_ID" && -n "$AUTOFORGE_GITHUB_APP_PRIVATE_KEY_BASE64" ]]; then
            az containerapp secret set -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --secrets "autoforge-github-app-private-key=$AUTOFORGE_GITHUB_APP_PRIVATE_KEY_BASE64"
            az containerapp update -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --set-env-vars \
                "AUTOFORGE_GITHUB_APP_ID=$AUTOFORGE_GITHUB_APP_ID" \
                "AUTOFORGE_GITHUB_INSTALLATION_ID=$AUTOFORGE_GITHUB_INSTALLATION_ID" \
                AUTOFORGE_GITHUB_APP_PRIVATE_KEY_BASE64=secretref:autoforge-github-app-private-key
          else
            echo "GitHub branch publishing remains disabled until its App credentials and AUTOFORGE_GITHUB_PUBLISH_ENABLED are configured."
            az containerapp update -g "${{ vars.AZURE_RG }}" -n aegis-backend \
              --set-env-vars AUTOFORGE_GITHUB_PUBLISH_ENABLED=false
          fi
          az containerapp secret set -g "${{ vars.AZURE_RG }}" -n aegis-backend \
            --secrets "autoforge-deployment-callback=$AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN"
          az containerapp update -g "${{ vars.AZURE_RG }}" -n aegis-backend \
            --set-env-vars \
              AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN=secretref:autoforge-deployment-callback \
              AUTOFORGE_DEPLOYMENT_ENABLED=true
          az containerapp update -g ${{ vars.AZURE_RG }} -n aegis-backend \
            --image $REGISTRY/aegis-backend:$IMAGE_TAG

      - name: Deploy frontend
        run: |
          az containerapp ingress update -g ${{ vars.AZURE_RG }} -n aegis-frontend \
            --target-port 80 --transport http
          BACKEND_FQDN=$(az containerapp show -g ${{ vars.AZURE_RG }} -n aegis-backend \
            --query properties.configuration.ingress.fqdn -o tsv)
          az containerapp update -g ${{ vars.AZURE_RG }} -n aegis-frontend \
            --image $REGISTRY/aegis-frontend:$IMAGE_TAG \
            --set-env-vars BACKEND_URL=https://$BACKEND_FQDN

      - name: Smoke test
        run: |
          URL=$(az containerapp show -g ${{ vars.AZURE_RG }} -n aegis-frontend \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "App URL: https://$URL"
          for i in 1 2 3 4 5 6; do
            FRONTEND_STATUS=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" "https://$URL/")
            API_STATUS=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" "https://$URL/api/health")
            echo "Attempt $i: frontend=$FRONTEND_STATUS api-health=$API_STATUS"
            if [ "$FRONTEND_STATUS" = "200" ] && [ "$API_STATUS" = "200" ]; then
              echo "Frontend and API health checks passed"
              exit 0
            fi
            if [ "$i" = "6" ]; then
              echo "Final API response headers:"
              curl -sS --max-time 15 -D - -o /dev/null "https://$URL/api/health" || true
            fi
            sleep 10
          done
          exit 1
