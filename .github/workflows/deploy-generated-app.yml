name: Deploy generated app to Azure Container Apps

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "generated/**"
  workflow_dispatch:
    inputs:
      branch:
        description: Existing feature branch to deploy
        required: true
        type: string
      retry_repair:
        description: Allow a fresh repair of a previously failed commit (remaining attempt budget only)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: generated-app-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: production
    env:
      ACA_ENVIRONMENT_NAME: ${{ vars.ACA_ENVIRONMENT_NAME || 'aegis-env' }}
      ACA_RESOURCE_GROUP: ${{ vars.AZURE_RG || vars.ACA_RESOURCE_GROUP || 'aegis-rg' }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
      ACA_REGISTRY_IDENTITY: ${{ vars.FOUNDRY_RUNTIME_IDENTITY_RESOURCE_ID }}
      AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN: ${{ secrets.AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN }}
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Checkout current platform packaging tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .autoforge-platform
          persist-credentials: false

      - name: Validate release configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="$DEPLOY_BRANCH"
          APP_KEY="${BRANCH#feature/}"
          BUILD_ID="${APP_KEY##*-}"
          APP_DIR="generated/$APP_KEY"
          if [[ "$BRANCH" != feature/* || ! "$BUILD_ID" =~ ^[a-f0-9]{8}$ ]]; then
            echo "Expected a feature/<use-case-slug>-<8-character-build-id> branch; got $BRANCH" >&2
            exit 1
          fi
          if [[ ! -d "$APP_DIR" ]]; then
            echo "Generated project directory is missing: $APP_DIR" >&2
            exit 1
          fi
          for name in ACR_NAME ACA_REGISTRY_IDENTITY AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions configuration: $name" >&2
              exit 1
            fi
          done
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "app_name=af-$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve backend callback URL
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_FQDN=$(az containerapp show \
            --name aegis-backend \
            --resource-group "$ACA_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [[ -z "$BACKEND_FQDN" || "$BACKEND_FQDN" == "None" ]]; then
            echo "Could not find the aegis-backend Container App ingress." >&2
            exit 1
          fi
          echo "BACKEND_URL=https://$BACKEND_FQDN" >> "$GITHUB_ENV"

      - name: Build generated project image
        id: image
        shell: bash
        env:
          APP_DIR: ${{ steps.config.outputs.app_dir }}
          BUILD_ID: ${{ steps.config.outputs.build_id }}
        run: |
          set -euo pipefail
          echo packaging > "$RUNNER_TEMP/deployment-phase"
          exec > >(tee "$RUNNER_TEMP/deployment.log") 2>&1
          if find "$APP_DIR" -type f \( -name pom.xml -o -name requirements.txt -o -name pyproject.toml -o -name go.mod \) \
              -not -path '*/tests/*' -print -quit | grep -q . && [[ ! -f "$APP_DIR/Dockerfile" ]]; then
            echo "This generated project includes a backend service but no root Dockerfile. Add a Dockerfile that packages the approved runtime before deploying; refusing to publish only its frontend." >&2
            exit 1
          fi

          CONTEXT="$APP_DIR"
          PORT=8080
          DOCKERFILE=""
          EXPECT_FRONTEND=false
          if [[ -f "$APP_DIR/.autoforge-release.json" ]]; then
            EXPECT_FRONTEND=$(jq -er 'if (.expectFrontend | type) == "boolean" then .expectFrontend | tostring else error("Invalid frontend contract") end' "$APP_DIR/.autoforge-release.json")
          fi
          if find "$APP_DIR" -type f -name index.html \
              -not -path '*/tests/*' -not -path '*/__tests__/*' -not -path '*/node_modules/*' \
              -print -quit | grep -q .; then
            EXPECT_FRONTEND=true
          fi
          if [[ -f "$APP_DIR/Dockerfile" ]]; then
            PORT=$(awk 'toupper($1)=="EXPOSE" {gsub(/\/tcp|\/udp/, "", $2); print $2; exit}' "$APP_DIR/Dockerfile" | grep -E '^[0-9]+$' || true)
            PORT="${PORT:-8080}"
            DOCKERFILE="$APP_DIR/Dockerfile"
          elif [[ -f "$APP_DIR/package.json" ]] && jq -e '.scripts.build' "$APP_DIR/package.json" >/dev/null; then
            cat > "$APP_DIR/.autoforge.Dockerfile" <<'DOCKER'
          FROM node:22-alpine AS build
          WORKDIR /src
          COPY . .
          RUN if [ -f package-lock.json ]; then npm ci; else npm install; fi \
              && npm run build \
              && output="$(find dist build -type f -name index.html 2>/dev/null | head -n 1 || true)" \
              && test -n "$output" \
              && mkdir -p /site \
              && cp -a "$(dirname "$output")"/. /site/
          FROM nginx:1.27-alpine
          COPY --from=build /site/ /usr/share/nginx/html/
          RUN printf 'server {\n  listen 8080;\n  server_name _;\n  root /usr/share/nginx/html;\n  index index.html;\n  location / { try_files $uri $uri/ /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
          EXPOSE 8080
          DOCKER
            DOCKERFILE="$APP_DIR/.autoforge.Dockerfile"
          elif [[ -f "$APP_DIR/package.json" ]] && jq -e '.scripts.start' "$APP_DIR/package.json" >/dev/null; then
            cat > "$APP_DIR/.autoforge.Dockerfile" <<'DOCKER'
          FROM node:22-alpine
          WORKDIR /app
          COPY . .
          RUN if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
          ENV PORT=8080 HOST=0.0.0.0
          EXPOSE 8080
          CMD ["npm", "start"]
          DOCKER
            DOCKERFILE="$APP_DIR/.autoforge.Dockerfile"
          elif REACT_ENTRY=$(find "$APP_DIR" -type f \( -iname '*.tsx' -o -iname '*.jsx' \) \
              -not -iname 'main.tsx' -not -iname 'main.jsx' \
              -not -iname '*.test.tsx' -not -iname '*.test.jsx' -not -iname '*.spec.tsx' -not -iname '*.spec.jsx' \
              -not -path '*/tests/*' -not -path '*/__tests__/*' -print -quit) && [[ -n "$REACT_ENTRY" ]]; then
            # Foundry sometimes returns valid React components without the Vite
            # entry files. Stage a complete build context without changing the
            # reviewed source committed on the feature branch.
            CONTEXT="$RUNNER_TEMP/autoforge-react"
            mkdir -p "$CONTEXT"
            if [[ "$REACT_ENTRY" == */src/* ]]; then
              SOURCE_ROOT="${REACT_ENTRY%%/src/*}"
              ENTRY_FROM_SRC="${REACT_ENTRY#"$SOURCE_ROOT/src/"}"
            else
              SOURCE_ROOT="$APP_DIR"
              ENTRY_FROM_SRC=$(basename "$REACT_ENTRY")
            fi
            cp -a "$SOURCE_ROOT"/. "$CONTEXT"/
            if [[ "$REACT_ENTRY" != */src/* ]]; then
              mkdir -p "$CONTEXT/src"
              cp "$REACT_ENTRY" "$CONTEXT/src/$ENTRY_FROM_SRC"
            fi
            EXTENSION="${REACT_ENTRY##*.}"
            IMPORT_PATH="./${ENTRY_FROM_SRC%.*}"
            if [[ -f "$CONTEXT/package.json" ]]; then
              jq '.private = true
                  | .type = "module"
                  | .scripts = ((.scripts // {}) + {"build":"vite build"})
                  | .dependencies = ((.dependencies // {}) + {"react":"latest","react-dom":"latest","vite":"latest","typescript":"latest"})' \
                "$CONTEXT/package.json" > "$CONTEXT/package.autoforge.json"
              mv "$CONTEXT/package.autoforge.json" "$CONTEXT/package.json"
            else
              cat > "$CONTEXT/package.json" <<'JSON'
          {"name":"autoforge-generated-app","version":"1.0.0","private":true,"type":"module","scripts":{"build":"vite build"},"dependencies":{"react":"latest","react-dom":"latest","vite":"latest","typescript":"latest"}}
          JSON
            fi
            if [[ ! -f "$CONTEXT/index.html" ]]; then
              printf '<!doctype html>\n<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AutoForge Application</title></head><body><div id="root"></div><script type="module" src="/src/main.%s"></script></body></html>\n' "$EXTENSION" > "$CONTEXT/index.html"
            fi
            if [[ ! -f "$CONTEXT/src/main.$EXTENSION" ]]; then
              if [[ "$EXTENSION" == "tsx" ]]; then
                printf '%s\n' 'import React from "react";' 'import { createRoot } from "react-dom/client";' "import App from \"$IMPORT_PATH\";" 'createRoot(document.getElementById("root")!).render(<React.StrictMode><App /></React.StrictMode>);' > "$CONTEXT/src/main.tsx"
              else
                printf '%s\n' 'import React from "react";' 'import { createRoot } from "react-dom/client";' "import App from \"$IMPORT_PATH\";" 'createRoot(document.getElementById("root")).render(<React.StrictMode><App /></React.StrictMode>);' > "$CONTEXT/src/main.jsx"
              fi
            fi
            cat > "$CONTEXT/Dockerfile" <<'DOCKER'
          FROM node:22-alpine AS build
          WORKDIR /src
          COPY . .
          RUN npm install && npm run build
          FROM nginx:1.27-alpine
          COPY --from=build /src/dist/ /usr/share/nginx/html/
          RUN printf 'server {\n  listen 8080;\n  server_name _;\n  root /usr/share/nginx/html;\n  index index.html;\n  location / { try_files $uri $uri/ /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
          EXPOSE 8080
          DOCKER
            DOCKERFILE="$CONTEXT/Dockerfile"
          else
            INDEX=$(find "$APP_DIR" -type f -name index.html \
              -not -path '*/tests/*' -not -path '*/__tests__/*' -not -path '*/node_modules/*' -print -quit)
            if [[ -z "$INDEX" ]]; then
              echo "No root Dockerfile, buildable package.json, or static index.html was found. Add a project Dockerfile to define how this approved stack should run." >&2
              exit 1
            fi
            WEB_ROOT=$(dirname "$INDEX")
            CONTEXT="$RUNNER_TEMP/autoforge-static"
            mkdir -p "$CONTEXT/site"
            while IFS= read -r -d '' FILE; do
              RELATIVE="${FILE#"$WEB_ROOT"/}"
              mkdir -p "$CONTEXT/site/$(dirname "$RELATIVE")"
              cp "$FILE" "$CONTEXT/site/$RELATIVE"
            done < <(find "$WEB_ROOT" -type f \
              \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.mjs' \
                 -o -iname '*.json' -o -iname '*.svg' -o -iname '*.png' -o -iname '*.jpg' \
                 -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.ico' \
                 -o -iname '*.woff' -o -iname '*.woff2' \) \
              -not -path '*/tests/*' -not -path '*/__tests__/*' -not -path '*/node_modules/*' -print0)
            cat > "$CONTEXT/Dockerfile" <<'DOCKER'
          FROM nginx:1.27-alpine
          COPY site/ /usr/share/nginx/html/
          RUN printf 'server {\n  listen 8080;\n  server_name _;\n  root /usr/share/nginx/html;\n  index index.html;\n  location / { try_files $uri $uri/ /index.html; }\n}\n' > /etc/nginx/conf.d/default.conf
          EXPOSE 8080
          DOCKER
            DOCKERFILE="$CONTEXT/Dockerfile"
          fi

          # CRA requires public/index.html. Older generated branches can contain
          # a Vite-style frontend/index.html but omit CRA's required template.
          for FRONTEND_ROOT in "$APP_DIR" "$APP_DIR/frontend"; do
            if [[ -f "$FRONTEND_ROOT/package.json" ]] && \
                jq -e '.scripts.build | strings | test("^react-scripts( |$)")' "$FRONTEND_ROOT/package.json" >/dev/null && \
                [[ ! -f "$FRONTEND_ROOT/public/index.html" ]]; then
              mkdir -p "$FRONTEND_ROOT/public"
              cat > "$FRONTEND_ROOT/public/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Generated Application</title>
          </head>
          <body>
            <noscript>This application requires JavaScript.</noscript>
            <div id="root"></div>
          </body>
          </html>
          HTML
            EXPECT_FRONTEND=true
              echo "Added missing CRA public/index.html for $FRONTEND_ROOT"
            fi
          done

          if [[ -z "$DOCKERFILE" || ! -f "$DOCKERFILE" ]]; then
            echo "AutoForge could not resolve a Dockerfile for the generated application." >&2
            exit 1
          fi

          echo "EXPECT_FRONTEND=$EXPECT_FRONTEND" >> "$GITHUB_ENV"
          IMAGE="$ACR_LOGIN_SERVER/autoforge-generated:$BUILD_ID-${DEPLOY_COMMIT:0:12}"
          echo "build_context=$(realpath "$CONTEXT")" >> "$GITHUB_OUTPUT"
          # Resolve model-authored npm locks with the package manager. This is
          # staged build input only; generated source/manifests stay unchanged.
          # Lifecycle scripts are disabled and no Azure/GitHub credentials enter
          # this container. Non-npm projects are left to their own toolchains.
          if find "$CONTEXT" -name package.json -not -path '*/node_modules/*' -print -quit | grep -q .; then
            docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --env npm_config_cache=/tmp/npm-cache \
            --mount "type=bind,source=$(realpath "$CONTEXT"),target=/project" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.autoforge-platform/scripts/resolve-generated-npm-locks.cjs,target=/resolve-locks.cjs,readonly" \
              node:22-alpine node /resolve-locks.cjs /project
          fi
          # Resolve generated Poetry locks with the exact Python/Poetry used by
          # the application's Dockerfile. This staged Dockerfile leaves the
          # reviewed source and manifests untouched; resolver failures still
          # fail the real build and return diagnostics to automatic repair.
          POETRY_DOCKERFILE="$RUNNER_TEMP/autoforge-packaged.Dockerfile"
          python3 "$GITHUB_WORKSPACE/.autoforge-platform/scripts/stage-generated-poetry.py" "$DOCKERFILE" "$POETRY_DOCKERFILE"
          DOCKERFILE="$POETRY_DOCKERFILE"
          echo registry > "$RUNNER_TEMP/deployment-phase"
          az acr login --name "$ACR_NAME"
          echo image_build > "$RUNNER_TEMP/deployment-phase"
          docker build --progress plain --file "$DOCKERFILE" --tag "$IMAGE" "$CONTEXT"

          echo startup > "$RUNNER_TEMP/deployment-phase"
          CONTAINER_ID=$(docker run --detach --publish "127.0.0.1::$PORT" "$IMAGE")
          cleanup_container() {
            docker logs "$CONTAINER_ID" 2>&1 || true
            docker rm --force "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup_container EXIT
          HOST_PORT=$(docker port "$CONTAINER_ID" "$PORT/tcp" 2>/dev/null | head -n 1 | awk -F: '{print $NF}' || true)
          if [[ -z "$HOST_PORT" ]]; then
            echo "Generated container exited before exposing port $PORT. Startup logs follow:" >&2
            docker inspect --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' "$CONTAINER_ID" || true
            exit 1
          fi
          PREFLIGHT_OK=false
          for attempt in {1..30}; do
            RESPONSE_FILE="$RUNNER_TEMP/container-preflight.html"
            RESPONSE=$(curl -sS --connect-timeout 1 --max-time 2 -o "$RESPONSE_FILE" \
              -w '%{http_code}|%{content_type}' "http://127.0.0.1:$HOST_PORT/" || true)
            STATUS="${RESPONSE%%|*}"
            CONTENT_TYPE="${RESPONSE#*|}"
            HTML_OK=true
            if [[ "$EXPECT_FRONTEND" == "true" ]]; then
              HTML_OK=false
              if [[ "$CONTENT_TYPE" == text/html* ]] && grep -Eiq '<!doctype html|<html([[:space:]>])' "$RESPONSE_FILE"; then
                HTML_OK=true
              fi
            fi
            echo "Container preflight $attempt: HTTP $STATUS ($CONTENT_TYPE), frontend HTML=$HTML_OK"
            if [[ "$STATUS" == "200" && "$HTML_OK" == "true" ]]; then
              PREFLIGHT_OK=true
              break
            fi
            if [[ "$STATUS" == "200" && "$HTML_OK" != "true" ]]; then
              echo "Generated project includes a frontend, but GET / did not return an HTML document." >&2
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null | grep -q true; then
              echo "Generated container exited during startup." >&2
              break
            fi
            sleep 2
          done
          if [[ "$PREFLIGHT_OK" != "true" ]]; then
            echo "Generated image did not pass the local HTTP startup check." >&2
            exit 1
          fi
          trap - EXIT
          cleanup_container

          echo registry > "$RUNNER_TEMP/deployment-phase"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Save resolved npm lockfiles
        if: always() && steps.image.outputs.build_context != ''
        uses: actions/upload-artifact@v4
        with:
          name: resolved-npm-locks-${{ steps.config.outputs.build_id }}-${{ github.run_id }}
          path: |
            ${{ steps.image.outputs.build_context }}/**/package-lock.json
            ${{ steps.image.outputs.build_context }}/**/npm-shrinkwrap.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or update generated Container App
        id: app
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PORT: ${{ steps.image.outputs.port }}
          APP_NAME: ${{ steps.config.outputs.app_name }}
        run: |
          set -euo pipefail
          echo azure > "$RUNNER_TEMP/deployment-phase"
          APP_STATE=$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --query properties.provisioningState -o tsv 2>/dev/null || true)
          if [[ "$APP_STATE" == "Failed" ]]; then
            echo "Removing failed generated Container App $APP_NAME before retrying deployment."
            az containerapp delete --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --yes --output none
            APP_STATE=""
          fi
          if [[ -n "$APP_STATE" ]]; then
            az containerapp identity assign --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --user-assigned "$ACA_REGISTRY_IDENTITY" --output none
            az containerapp registry set --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --server "$ACR_LOGIN_SERVER" --identity "$ACA_REGISTRY_IDENTITY" --output none
            az containerapp update --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --image "$IMAGE" --cpu 0.5 --memory 1.0Gi \
              --set-env-vars PORT="$PORT" --output none
            az containerapp ingress update --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --target-port "$PORT" --transport http --output none
          else
            az containerapp create --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT_NAME" --image "$IMAGE" \
              --ingress external --target-port "$PORT" --transport http \
              --registry-server "$ACR_LOGIN_SERVER" --registry-identity "$ACA_REGISTRY_IDENTITY" \
              --user-assigned "$ACA_REGISTRY_IDENTITY" --min-replicas 0 --max-replicas 1 \
              --cpu 0.5 --memory 1.0Gi --env-vars PORT="$PORT" --output none
          fi
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [[ -z "$FQDN" || "$FQDN" == "None" ]]; then
            echo "Azure did not return an ingress hostname for $APP_NAME." >&2
            exit 1
          fi
          echo "app_url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed application
        env:
          APP_URL: ${{ steps.app.outputs.app_url }}
          APP_NAME: ${{ steps.config.outputs.app_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo smoke > "$RUNNER_TEMP/deployment-phase"
          for attempt in {1..12}; do
            RESPONSE_FILE="$RUNNER_TEMP/deployed-root.html"
            RESPONSE=$(curl -sS --connect-timeout 3 --max-time 5 -o "$RESPONSE_FILE" -w '%{http_code}|%{content_type}' "$APP_URL/" || true)
            STATUS="${RESPONSE%%|*}"
            CONTENT_TYPE="${RESPONSE#*|}"
            echo "Smoke test $attempt: HTTP $STATUS"
            if [[ "$STATUS" == "200" ]]; then
              if [[ "${EXPECT_FRONTEND:-false}" != "true" ]]; then exit 0; fi
              if [[ "$CONTENT_TYPE" == text/html* ]] && grep -Eiq '<!doctype html|<html([[:space:]>])' "$RESPONSE_FILE"; then exit 0; fi
              echo "Approved frontend is missing: deployed GET / must return an HTML document, not an API status response." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Azure revision state:" >&2
          az containerapp revision list --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --query '[].{name:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState}' \
            --output table || true
          echo "Recent container logs:" >&2
          az containerapp logs show --name "$APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --tail 100 || true
          echo "Generated application did not return HTTP 200 from $APP_URL." >&2
          exit 1

      - name: Report successful deployment to AutoForge
        if: success()
        env:
          BUILD_ID: ${{ steps.config.outputs.build_id }}
          APP_URL: ${{ steps.app.outputs.app_url }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -n --arg branch "$DEPLOY_BRANCH" --arg url "$APP_URL" --arg commit "$DEPLOY_COMMIT" \
            '{branch:$branch,status:"succeeded",url:$url,commitSha:$commit}')
          for attempt in {1..12}; do
            STATUS=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/callback.json" -w '%{http_code}' \
              -H "Authorization: Bearer $AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN" \
              -H 'Content-Type: application/json' -X POST \
              --data "$BODY" "$BACKEND_URL/api/builds/$BUILD_ID/deployment-callback" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "AutoForge recorded the deployed application URL."
              exit 0
            fi
            echo "Waiting for AutoForge to record the feature branch (callback HTTP $STATUS)."
            sleep 10
          done
          echo "Could not report deployment status to AutoForge; see $APP_URL in this workflow run." >&2
          exit 1

      - name: Report failed deployment to AutoForge
        if: failure() && env.AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN != ''
        env:
          BUILD_ID: ${{ steps.config.outputs.build_id }}
          REPAIR_REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_repair && github.run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${BACKEND_URL:-}" && -n "${BUILD_ID:-}" ]] || exit 0
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          phase_path = root / 'deployment-phase'
          phase = phase_path.read_text().strip() if phase_path.exists() else 'configuration'
          log = root / 'deployment.log'
          # Read a bounded tail without loading arbitrarily large build logs.
          if log.exists():
              with log.open('rb') as stream:
                  stream.seek(max(0, log.stat().st_size - 64000))
                  detail = stream.read().decode('utf-8', errors='replace')
          else:
              detail = ''
          for name, value in os.environ.items():
              if len(value) >= 8 and any(key in name.upper() for key in ('TOKEN', 'SECRET', 'PASSWORD', 'PRIVATE_KEY', 'CONNECTION_STRING')):
                  detail = detail.replace(value, '[REDACTED]')
          detail = re.sub(r'(?i)(bearer\s+)[\w.+=/-]+', r'\1[REDACTED]', detail)
          detail = re.sub(r'(?i)((?:password|token|secret|api[_-]?key)\s*[=:]\s*)[^\s,;]+', r'\1[REDACTED]', detail)
          detail = re.sub(r'(https?://)[^\s/@]+:[^\s/@]+@', r'\1[REDACTED]@', detail)
          detail = re.sub(r'-----BEGIN [^-]*PRIVATE KEY-----.*?-----END [^-]*PRIVATE KEY-----', '[REDACTED]', detail, flags=re.S)
          detail = detail[-14000:] if phase in ('packaging', 'image_build', 'startup') else ''
          payload = {'branch': os.environ['DEPLOY_BRANCH'], 'status': 'failed',
                     'commitSha': os.environ.get('DEPLOY_COMMIT', ''), 'phase': phase,
                     'diagnostics': detail, 'repairRequestId': os.environ.get('REPAIR_REQUEST_ID', ''),
                     'message': f'Generated application failed during {phase}. ' + detail[-700:]}
          (root / 'failure-callback.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          # POST is idempotent for this commit. Repeating it also polls repair
          # progress, including when the first acknowledgement was lost.
          for attempt in {1..128}; do
            STATUS=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/repair-response.json" -w '%{http_code}' \
              -H "Authorization: Bearer $AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN" \
              -H 'Content-Type: application/json' -X POST \
              --data-binary @"$RUNNER_TEMP/failure-callback.json" "$BACKEND_URL/api/builds/$BUILD_ID/deployment-callback" || true)
            # A newer commit means this failure is obsolete; its run is queued.
            if [[ "$STATUS" == "409" ]]; then
              echo "Callback commit is stale or publication is still being recorded."
            elif [[ "$STATUS" == "200" ]]; then
              REPAIRING=$(jq -r '.deploymentRepairing // false' "$RUNNER_TEMP/repair-response.json")
              CURRENT=$(jq -r '.deploymentCommit // ""' "$RUNNER_TEMP/repair-response.json")
              if [[ -n "$CURRENT" && "$CURRENT" != "$DEPLOY_COMMIT" ]]; then
                echo "Reviewed repair published; the feature-branch push triggers its rebuild."
                exit 0
              fi
              if [[ "$REPAIRING" != "true" ]]; then
                echo "Failure recorded; no further automatic repair is running."
                exit 0
              fi
              echo "Automatic source repair is in progress ($attempt/128)."
            fi
            sleep 15
          done
          # Turn a worker restart or lost repair task into a visible failure.
          jq '.phase="repair_timeout" | .diagnostics="" | .message="Automatic deployment repair timed out. Check backend logs; the application has not been deployed."' \
            "$RUNNER_TEMP/failure-callback.json" > "$RUNNER_TEMP/repair-timeout.json"
          curl -sS --max-time 20 -o /dev/null \
            -H "Authorization: Bearer $AUTOFORGE_DEPLOYMENT_CALLBACK_TOKEN" \
            -H 'Content-Type: application/json' -X POST \
            --data-binary @"$RUNNER_TEMP/repair-timeout.json" "$BACKEND_URL/api/builds/$BUILD_ID/deployment-callback" || true
          echo "Repair acknowledgement timed out; inspect the backend and workflow logs." >&2
