name: CI

on:
  push:
    branches: [feature/main-m, develop]
  pull_request:
    branches: [feature/main-m]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # exit code 5 = "no tests found"; allowed until you add tests
      - run: python -m pytest -q || [ $? -eq 5 ]

  frontend-build:
    runs-on: ubuntu-latest          # runs from the repo root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w frontend -- --configuration production

  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
          - service: frontend
            context: .
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (feature/main-m only)
        if: github.ref == 'refs/heads/feature/main-m' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on feature/main-m)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.ref == 'refs/heads/feature/main-m' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aegis-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aegis-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max